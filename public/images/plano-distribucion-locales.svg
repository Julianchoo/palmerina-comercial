<svg xmlns="http://www.w3.org/2000/svg" width="594mm" height="420mm" viewBox="0 0 594 420">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#26351c"/>
    </marker>
    <pattern id="parking" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 0 H 10" fill="none" stroke="#a2a79e" stroke-width="0.28" vector-effect="non-scaling-stroke"/>
    </pattern>
    <style>
      .title { font: 700 10px Arial, sans-serif; fill: #26351c; letter-spacing: 0.8px; }
      .subtitle { font: 400 4px Arial, sans-serif; fill: #66705f; letter-spacing: 0.35px; }
      .label { font: 600 2.6px Arial, sans-serif; fill: #26351c; text-anchor: middle; }
      .small { font: 400 2px Arial, sans-serif; fill: #26351c; text-anchor: middle; }
      .tiny { font: 400 1.65px Arial, sans-serif; fill: #44503d; text-anchor: middle; }
      .road-label { font: 600 2.1px Arial, sans-serif; fill: #ffffff; text-anchor: middle; letter-spacing: 0.12px; }
      .dimension { stroke: #26351c; stroke-width: 0.35; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .extension { stroke: #77806f; stroke-width: 0.25; stroke-dasharray: 1 1; }
      .plot-line { stroke: #26351c; stroke-width: 0.7; fill: #f4f1e8; }
      .building { stroke: #26351c; stroke-width: 0.35; }
      .stall { stroke: #a2a79e; stroke-width: 0.22; fill: none; }
    </style>
  </defs>

  <rect width="594" height="420" fill="#fbfaf6"/>

  <text x="32" y="18" class="title">LA PALMERINA MALL</text>
  <text x="32" y="27" class="subtitle">ANTEPROYECTO CONCEPTUAL DE IMPLANTACIÓN · PARCELA 100 × 180 m</text>

  <!-- Route and entrance -->
  <rect x="32" y="29" width="236" height="8" rx="1" fill="#4b4e49"/>
  <path d="M 32 33 H 268" stroke="#f5d46e" stroke-width="0.4" stroke-dasharray="5 3"/>
  <text x="150" y="34.4" style="font:700 3.2px Arial,sans-serif;fill:#fff;text-anchor:middle;letter-spacing:1px">RUTA / FRENTE PRINCIPAL</text>
  <path d="M 140 37 V 47 M 160 37 V 47" stroke="#747a70" stroke-width="1.1"/>
  <text x="150" y="43.5" style="font:600 2.4px Arial,sans-serif;fill:#26351c;text-anchor:middle">ACCESO 10 m</text>

  <!-- Dimensions outside the plot -->
  <path d="M 50 40 V 34 M 250 40 V 34" class="extension"/>
  <path d="M 50 36 H 250" class="dimension"/>
  <text x="150" y="34.8" style="font:600 3px Arial,sans-serif;fill:#26351c;text-anchor:middle">100,00 m</text>
  <path d="M 250 40 H 259 M 250 400 H 259" class="extension"/>
  <path d="M 256 40 V 400" class="dimension"/>
  <text x="261" y="220" transform="rotate(90 261 220)" style="font:600 3px Arial,sans-serif;fill:#26351c;text-anchor:middle">180,00 m</text>

  <!-- The plan is drawn in metres inside this group: 1 m = 2 mm, scale 1:500 -->
  <g transform="translate(50 40) scale(2)">
    <rect x="0" y="0" width="100" height="180" class="plot-line" vector-effect="non-scaling-stroke"/>

    <!-- Setbacks and landscaped arrival -->
    <rect x="0" y="0" width="100" height="22" fill="#dfe7d6"/>
    <rect x="5" y="5" width="37" height="12" rx="1" fill="#cbd9bd" stroke="#9aaa89" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
    <rect x="58" y="5" width="37" height="12" rx="1" fill="#cbd9bd" stroke="#9aaa89" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
    <text x="23.5" y="10" class="label">PLAZA / VERDE</text>
    <text x="23.5" y="13" class="tiny">cartelería y expansión</text>
    <text x="76.5" y="10" class="label">PLAZA / VERDE</text>
    <text x="76.5" y="13" class="tiny">cartelería y expansión</text>

    <!-- Main two-way spine and cross aisles -->
    <rect x="45" y="0" width="10" height="150" fill="#737872"/>
    <path d="M 50 0 V 150" stroke="#f6f3e9" stroke-width="0.3" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
    <text x="50" y="18" class="road-label" transform="rotate(90 50 18)">AVENIDA CENTRAL · 10 m</text>
    <rect x="20" y="22" width="60" height="8" fill="#737872"/>
    <rect x="20" y="62" width="60" height="8" fill="#737872"/>
    <rect x="20" y="134" width="60" height="8" fill="#737872"/>
    <text x="50" y="26.8" class="road-label">CALLE TRANSVERSAL · 8 m</text>
    <text x="50" y="66.8" class="road-label">CALLE TRANSVERSAL · 8 m</text>
    <text x="50" y="138.8" class="road-label">CALLE TRANSVERSAL · 8 m</text>

    <!-- Side circulation and pedestrian walks -->
    <rect x="20" y="30" width="8" height="104" fill="#858a84"/>
    <rect x="72" y="30" width="8" height="104" fill="#858a84"/>
    <text x="24" y="96" class="road-label" transform="rotate(90 24 96)">CIRCULACIÓN · 8 m</text>
    <text x="76" y="96" class="road-label" transform="rotate(90 76 96)">CIRCULACIÓN · 8 m</text>
    <rect x="18" y="30" width="2" height="104" fill="#dfcfab"/>
    <rect x="80" y="30" width="2" height="104" fill="#dfcfab"/>
    <text x="19" y="96" class="tiny" transform="rotate(90 19 96)">VEREDA CUBIERTA · 2 m</text>
    <text x="81" y="96" class="tiny" transform="rotate(90 81 96)">VEREDA CUBIERTA · 2 m</text>

    <!-- Small shops: 8 units, 8 × 13 m -->
    <g fill="#8fa477">
      <rect x="5" y="30" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="5" y="38" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="5" y="46" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="5" y="54" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="30" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="38" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="46" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="54" width="13" height="8" class="building" vector-effect="non-scaling-stroke"/>
    </g>
    <text x="11.5" y="42.5" class="label">4 LOCALES</text>
    <text x="11.5" y="45.5" class="small">CHICOS</text>
    <text x="11.5" y="49" class="tiny">8 × 13 m</text>
    <text x="88.5" y="42.5" class="label">4 LOCALES</text>
    <text x="88.5" y="45.5" class="small">CHICOS</text>
    <text x="88.5" y="49" class="tiny">8 × 13 m</text>

    <!-- Medium shops: 8 units, 16 × 13 m -->
    <g fill="#607a4c">
      <rect x="5" y="70" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="5" y="86" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="5" y="102" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="5" y="118" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="70" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="86" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="102" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
      <rect x="82" y="118" width="13" height="16" class="building" vector-effect="non-scaling-stroke"/>
    </g>
    <text x="11.5" y="96" class="label">4 LOCALES</text>
    <text x="11.5" y="99" class="small">MEDIANOS</text>
    <text x="11.5" y="102.5" class="tiny">16 × 13 m</text>
    <text x="88.5" y="96" class="label">4 LOCALES</text>
    <text x="88.5" y="99" class="small">MEDIANOS</text>
    <text x="88.5" y="102.5" class="tiny">16 × 13 m</text>

    <!-- Parking fields: 2.5 × 5 m stalls, 7 m aisles -->
    <g>
      <rect x="28" y="30" width="5" height="32" fill="url(#parking)" class="stall"/>
      <rect x="40" y="30" width="5" height="32" fill="url(#parking)" class="stall"/>
      <rect x="55" y="30" width="5" height="32" fill="url(#parking)" class="stall"/>
      <rect x="67" y="30" width="5" height="32" fill="url(#parking)" class="stall"/>
      <rect x="28" y="70" width="5" height="64" fill="url(#parking)" class="stall"/>
      <rect x="40" y="70" width="5" height="64" fill="url(#parking)" class="stall"/>
      <rect x="55" y="70" width="5" height="64" fill="url(#parking)" class="stall"/>
      <rect x="67" y="70" width="5" height="64" fill="url(#parking)" class="stall"/>
      <rect x="33" y="30" width="7" height="32" fill="#d5d5cf"/>
      <rect x="60" y="30" width="7" height="32" fill="#d5d5cf"/>
      <rect x="33" y="70" width="7" height="64" fill="#d5d5cf"/>
      <rect x="60" y="70" width="7" height="64" fill="#d5d5cf"/>
    </g>
    <text x="36.5" y="47" class="tiny" transform="rotate(90 36.5 47)">CALLE DE ESTACIONAMIENTO · 7 m</text>
    <text x="63.5" y="47" class="tiny" transform="rotate(90 63.5 47)">CALLE DE ESTACIONAMIENTO · 7 m</text>
    <text x="36.5" y="102" class="tiny" transform="rotate(90 36.5 102)">CALLE DE ESTACIONAMIENTO · 7 m</text>
    <text x="63.5" y="102" class="tiny" transform="rotate(90 63.5 102)">CALLE DE ESTACIONAMIENTO · 7 m</text>

    <!-- Accessible stalls near crossings -->
    <g fill="#d7e8ef" stroke="#39738c" stroke-width="0.3" vector-effect="non-scaling-stroke">
      <rect x="28" y="57" width="5" height="5"/><rect x="40" y="57" width="5" height="5"/>
      <rect x="55" y="57" width="5" height="5"/><rect x="67" y="57" width="5" height="5"/>
      <rect x="28" y="129" width="5" height="5"/><rect x="40" y="129" width="5" height="5"/>
      <rect x="55" y="129" width="5" height="5"/><rect x="67" y="129" width="5" height="5"/>
    </g>
    <text x="30.5" y="60.3" class="tiny">PMR</text><text x="42.5" y="60.3" class="tiny">PMR</text>
    <text x="57.5" y="60.3" class="tiny">PMR</text><text x="69.5" y="60.3" class="tiny">PMR</text>

    <!-- Anchor forecourt and large shops -->
    <rect x="5" y="142" width="90" height="8" fill="#dfcfab"/>
    <text x="50" y="147" class="label">PASEO PEATONAL / ÁREA DE DESCARGA CONTROLADA · 8 m</text>
    <rect x="5" y="150" width="42" height="25" fill="#354b2b" class="building" vector-effect="non-scaling-stroke"/>
    <rect x="53" y="150" width="42" height="25" fill="#354b2b" class="building" vector-effect="non-scaling-stroke"/>
    <rect x="47" y="150" width="6" height="25" fill="#858a84"/>
    <text x="26" y="161" class="road-label">LOCAL GRANDE A</text>
    <text x="26" y="165" class="road-label">42 × 25 m · 1.050 m²</text>
    <text x="74" y="161" class="road-label">LOCAL GRANDE B</text>
    <text x="74" y="165" class="road-label">42 × 25 m · 1.050 m²</text>
    <text x="50" y="164" class="road-label" transform="rotate(90 50 164)">SERVICIO · 6 m</text>
    <rect x="5" y="175" width="90" height="5" fill="#cbd9bd"/>
    <text x="50" y="178.5" class="small">RETIRO POSTERIOR PROPUESTO · 5 m</text>

    <!-- Side setback labels -->
    <text x="2.5" y="105" class="tiny" transform="rotate(-90 2.5 105)">RETIRO LATERAL PROPUESTO · 5 m</text>
    <text x="97.5" y="105" class="tiny" transform="rotate(90 97.5 105)">RETIRO LATERAL PROPUESTO · 5 m</text>
  </g>

  <!-- Information panel -->
  <rect x="280" y="40" width="282" height="360" rx="3" fill="#ffffff" stroke="#d4d6cf" stroke-width="0.6"/>
  <text x="300" y="66" style="font:700 8px Arial,sans-serif;fill:#26351c">PROPUESTA DE DISTRIBUCIÓN</text>
  <line x1="300" y1="75" x2="542" y2="75" stroke="#26351c" stroke-width="0.6"/>

  <text x="300" y="98" style="font:700 5px Arial,sans-serif;fill:#26351c">PROGRAMA COMERCIAL</text>
  <g style="font:400 4.2px Arial,sans-serif;fill:#44503d">
    <text x="300" y="113">8 locales chicos · 8 × 13 m · 104 m² cada uno</text>
    <text x="300" y="126">8 locales medianos · 16 × 13 m · 208 m² cada uno</text>
    <text x="300" y="139">2 locales grandes · 42 × 25 m · 1.050 m² cada uno</text>
    <text x="300" y="155">Superficie comercial cubierta aproximada: 4.596 m²</text>
  </g>

  <text x="300" y="184" style="font:700 5px Arial,sans-serif;fill:#26351c">CIRCULACIÓN Y ESTACIONAMIENTO</text>
  <g style="font:400 4.2px Arial,sans-serif;fill:#44503d">
    <text x="300" y="199">Acceso principal y avenida central de doble sentido: 10 m</text>
    <text x="300" y="212">Calles transversales y circulación lateral: 8 m</text>
    <text x="300" y="225">Calles entre filas de estacionamiento: 7 m</text>
    <text x="300" y="238">Módulo vehicular indicativo: 2,50 × 5,00 m</text>
    <text x="300" y="251">Capacidad estimada: 148 plazas, incluidas 8 accesibles</text>
  </g>

  <text x="300" y="280" style="font:700 5px Arial,sans-serif;fill:#26351c">CRITERIO GENERAL</text>
  <g style="font:400 4.2px Arial,sans-serif;fill:#44503d">
    <text x="300" y="295">Locales chicos próximos al acceso para mayor rotación.</text>
    <text x="300" y="308">Locales medianos sobre los laterales con frente al estacionamiento.</text>
    <text x="300" y="321">Locales ancla al fondo para activar todo el recorrido comercial.</text>
    <text x="300" y="334">Circulación continua, cruces periódicos y veredas protegidas.</text>
  </g>

  <rect x="300" y="354" width="242" height="28" rx="2" fill="#f1ece0"/>
  <text x="310" y="365" style="font:700 4px Arial,sans-serif;fill:#6b542c">NOTA</text>
  <text x="310" y="374" style="font:400 3.5px Arial,sans-serif;fill:#6b6253">Esquema conceptual. Retiros, radios de giro, incendio, cargas,</text>
  <text x="310" y="380" style="font:400 3.5px Arial,sans-serif;fill:#6b6253">accesibilidad y cantidad de cocheras deben validarse con normativa local.</text>

  <text x="32" y="411" style="font:600 3.8px Arial,sans-serif;fill:#26351c">ESCALA 1:500 · IMPRIMIR AL 100% EN HOJA A2 HORIZONTAL (594 × 420 mm)</text>
  <text x="562" y="411" style="font:400 3.5px Arial,sans-serif;fill:#66705f;text-anchor:end">23.06.2026 · CONCEPTUAL</text>
</svg>
